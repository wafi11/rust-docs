[package]
name = "latihan"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
redis = "1.8"
apalis = "1.0.0"
apalis-redis = "1.0.0"
apalis-board = { version = "1.0.0", features = ["axum", "ui"] }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = {version = "0.9.0", features = ["runtime-tokio","postgres"]}
tokio = { version = "1.45.0", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json"] }
